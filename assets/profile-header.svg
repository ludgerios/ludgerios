<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Breno Ludgerio — ITSM, ServiceNow, Automation and Integrations">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="218" rx="18" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="1000" height="4" rx="2" fill="url(#accent)"/>

  <circle cx="28" cy="27" r="5" fill="#ff5f56"/>
  <circle cx="47" cy="27" r="5" fill="#ffbd2e"/>
  <circle cx="66" cy="27" r="5" fill="#27c93f"/>

  <text x="500" y="72" text-anchor="middle" fill="#f0f6fc"
        font-family="Segoe UI, Inter, Arial, sans-serif" font-size="34" font-weight="700">
    Breno Ludgerio
  </text>

  <text x="500" y="105" text-anchor="middle" fill="#8b949e"
        font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="600">
    ITSM • ServiceNow • Automation • Integrations
  </text>

  <rect x="210" y="124" width="580" height="1" fill="#21262d"/>

  <g font-family="Consolas, Menlo, monospace" font-size="17">
    <text x="500" y="163" text-anchor="middle" fill="#c9d1d9" opacity="0">
      ServiceNow • JavaScript • Incident &amp; Problem Management
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               values="0;1;1;0;0;0;0;0;0"
               keyTimes="0;0.02;0.22;0.25;0.25;0.5;0.75;0.98;1"/>
    </text>

    <text x="500" y="163" text-anchor="middle" fill="#c9d1d9" opacity="0">
      Power Automate • Microsoft Teams • Adaptive Cards
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               values="0;0;0;1;1;0;0;0;0"
               keyTimes="0;0.24;0.25;0.27;0.47;0.5;0.75;0.98;1"/>
    </text>

    <text x="500" y="163" text-anchor="middle" fill="#c9d1d9" opacity="0">
      REST APIs • JSON • SQL Server • T-SQL
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               values="0;0;0;0;0;1;1;0;0"
               keyTimes="0;0.24;0.25;0.49;0.5;0.52;0.72;0.75;1"/>
    </text>

    <text x="500" y="163" text-anchor="middle" fill="#c9d1d9" opacity="0">
      Flow Designer • Business Rules • Scripted REST APIs
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               values="0;0;0;0;0;0;0;1;0"
               keyTimes="0;0.24;0.25;0.49;0.5;0.74;0.75;0.77;1"/>
    </text>
  </g>

  <rect x="350" y="190" width="300" height="3" rx="2" fill="#21262d"/>
  <rect x="350" y="190" width="0" height="3" rx="2" fill="url(#accent)" filter="url(#glow)">
    <animate attributeName="width" values="0;300;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>